<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Skill</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-5 rounded-4" style="max-width: 500px; margin:auto;">
        <h3 class="mb-4">Add New Skill</h3>

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="skill_name" class="form-control mb-3" placeholder="Skill Name" required>

            <select name="proficiency_level" class="form-select mb-3">
                <option>Beginner</option>
                <option>Intermediate</option>
                <option>Advanced</option>
            </select>

            <input type="number" name="years_of_experience" class="form-control mb-3" placeholder="Years of Experience" required>

            <button type="submit" class="btn btn-success w-100">Save Skill</button>
        </form>

        <p class="mt-3 text-center">
            <a href="{% url 'dashboard' %}">Back to Dashboard</a>
        </p>
    </div>
</div>

</body>
</html>
