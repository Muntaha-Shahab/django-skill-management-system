<!DOCTYPE html>
<html lang="en">
<head>
    <title>Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand fs-4 fw-bold">Skill Dashboard</span>
        <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Hello, {{ request.user.username }}</h2>
        <a href="{% url 'add_skill' %}" class="btn btn-primary btn-lg">Add New Skill</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-bordered table-hover table-lg align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Skill</th>
                    <th>Proficiency</th>
                    <th>Years of Experience</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for skill in skills %}
                <tr>
                    <td>{{ skill.skill_name }}</td>
                    <td>{{ skill.proficiency_level }}</td>
                    <td>{{ skill.years_of_experience }}</td>
                    <td>
                        <a href="{% url 'delete_skill' skill.id %}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?');">Delete</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center">No skills added yet</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
